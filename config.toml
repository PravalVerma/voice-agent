# Voice Calling Agent configuration.
# Secrets (API keys) do NOT go here — they live in .env (see .env.example).

[persona]
agent_name = "Asha"

# One [[languages]] entry per language the caller can pick from the dropdown.
# default_language is used when no/an unrecognized code is sent by the client.
# TTS voice (model tier + gender) is no longer configured here - it's chosen by
# the caller at call time from whatever Google's API actually has for that
# language (see app/tts_catalog.py). The system prompt is also no longer
# per-language: it's the admin-editable base prompt (Settings page /
# app/settings_store.py) plus a code-generated language-lock instruction.
#
# enabled=false languages are kept (not deleted) for languages we haven't
# verified work well enough to offer yet - see docs/archived_language_prompts.md
# for the full history/reasoning and their old (unreviewed) translated prompts.
default_language = "en"

[[languages]]
code = "en"
label = "English"
stt_language = "en"

[[languages]]
code = "hi"
label = "Hindi"
stt_language = "hi"

[[languages]]
code = "pa"
label = "Punjabi"
stt_language = "pa"
enabled = false  # narrowed down to English/Hindi only, per user request

[[languages]]
code = "ta"
label = "Tamil"
stt_language = "ta"
enabled = false  # narrowed down to English/Hindi only, per user request

[[languages]]
code = "te"
label = "Telugu"
stt_language = "te"
enabled = false  # never live-tested with real mic audio on whisper-large-v3

[[languages]]
code = "ml"
label = "Malayalam"
stt_language = "ml"
enabled = false  # confirmed-broken STT regardless of model size/prompting

[[languages]]
code = "gu"
label = "Gujarati"
stt_language = "gu"
enabled = false  # never live-tested with real mic audio on whisper-large-v3

[[languages]]
code = "bn"
label = "Bengali"
stt_language = "bn"
enabled = false  # narrowed down to English/Hindi only, per user request

[vad]
threshold = 0.5              # speech-start probability threshold
end_threshold = 0.35         # speech-end probability threshold (hysteresis)
silence_ms = 600             # silence needed to consider the utterance finished (try 500-800)
min_speech_ms = 120          # minimum voiced duration to count as speech (filters clicks)
pre_roll_ms = 300            # audio kept from before speech onset so first syllables aren't clipped
max_utterance_s = 20         # force end-of-utterance after this long
barge_in_min_speech_ms = 200 # stricter gate while the agent is speaking (echo protection)
barge_in_threshold = 0.6

[stt]
provider = "groq"            # groq | local
model = "whisper-large-v3"    # full model, not turbo - more accurate on Indic languages, ~2.8x pricier ($0.111/hr vs $0.04/hr) but still a tiny fraction of per-call cost

[llm]
# model must match provider - examples: groq "openai/gpt-oss-20b", ollama "llama3.2",
# openai "gpt-4o-mini" (needs `uv sync --extra openai`), gemini "gemini-2.0-flash"
provider = "groq"            # groq | ollama | openai | gemini
model = "openai/gpt-oss-20b"
max_tokens = 400             # short answers: better latency, cost, and phone-call feel
                              # (was 200 -> 500 -> 700, raised each time because Indic replies were
                              # being cut off mid-sentence; gpt-oss counts its reasoning tokens
                              # against this cap too, which is why the visible replies looked far
                              # shorter than the limit that truncated them)
                              #
                              # Back down to 400 because Groq reserves the FULL max_tokens against
                              # the per-minute rate limit, whether or not it gets used: at 700 every
                              # Hindi turn cost ~4,100 TPM for a reply that measured 50-193 tokens.
                              # 400 was picked off 11 probes across the longest stages and the most
                              # reasoning-heavy caller inputs - worst case 193 tokens, all finishing
                              # naturally - so it keeps ~2x headroom over anything observed. If
                              # mid-sentence cut-offs ever reappear in an Indic language, raise this
                              # first before suspecting anything else.
temperature = 0.6
max_requests_per_call = 10   # a complete collections call should use well under this;
                              # the ceiling exists to stop a runaway tool loop or a
                              # retry storm spending the daily cap on a single call
warn_prompt_tokens = 1000    # per-request prompt size that warrants a log warning
history_max_turns = 4        # EXCHANGES (a caller turn plus the reply to it) kept in
                              # context, not individual messages - trim_history walks
                              # back to a user message so the window never opens
                              # mid-exchange. Was 12 messages; 4 exchanges is roughly
                              # the same span of conversation but holds the per-turn
                              # payload down, which is the only budget lever that
                              # still works now that prompt caching is known not to
                              # apply on this tier (see scripts/check_cache.py).

[tts]
provider = "google"          # google
# no static "voice" here anymore - it's resolved per call from the caller's
# language/tier/gender choice against the live Google voice catalog
speaking_rate = 1.0
sample_rate = 24000

[call]
max_call_minutes = 10
log_dir = "logs/calls"
dump_utterances = false      # debug: save each captured user utterance as a WAV in the call log dir
record_calls = true          # save a mono mixdown of each call as recording.wav in its log dir, and
                             # archive it to S3 when S3_RECORDINGS_BUCKET is set in .env (see s3_archive.py)

[cost]                       # rates from the design PDF, used for the per-call estimate
usd_to_inr = 96.4            # checked 2026-07-20 - was stale at 88.0, real rate had moved ~9.5%
stt_usd_per_hour = 0.111     # Groq whisper-large-v3 (full model), billed minimum 10 s per request
llm_usd_per_mtok_in = 0.075  # Groq openai/gpt-oss-20b
llm_usd_per_mtok_out = 0.30
tts_usd_per_mchar = 16.0     # fallback only (WaveNet rate) - apply_language() overwrites this
                              # per call with the real rate for whichever tier the caller picked
                              # (see app/tts_catalog.py: Standard 4.0, Wavenet/Neural2 16.0, Chirp3-HD 30.0)


[compliance]
# Enforcement for collections-mode bots (bots.mode = 'collections'). None of it
# applies to ordinary assistant bots. Everything here is checked in code - the
# system prompt deliberately does NOT repeat these rules, because a prompt
# instruction is a hint and this is the gate.
#
# Regex values use TOML literal strings - single quotes, or ''' ''' when the
# pattern itself contains an apostrophe. NEVER use double quotes here: TOML
# processes escapes inside a basic string, so a '\b' word boundary silently
# becomes a backspace character and the pattern then matches nothing at all.
# Patterns are compiled at config load so a syntax error fails at startup with
# one clear line - but a backspace is valid syntax and compiles fine, which is
# why the quoting rule matters more than the compile check does.
#
# The calling window is evaluated in the BORROWER's local timezone
# (customers.timezone), never the server's. Kept deliberately inside any
# published bound so a config mistake fails safe rather than widening it.
call_window_start = "09:00"
call_window_end = "19:00"
allowed_weekdays = [0, 1, 2, 3, 4, 5]  # Mon=0 .. Sun=6; Sunday excluded by default
holidays = []                           # ["2026-10-20", ...] - borrower-local dates
max_attempts_per_day = 1                # counts dialling attempts, not connections:
                                        # the regulation caps contacting, so a call
                                        # that rings out still spends one
max_attempts_per_week = 3
max_promise_days = 30                   # furthest-out promise-to-pay date accepted
settlement_floor_pct = 75               # the hard floor from prompt.md; used to
                                        # pre-expand the amounts screen_outbound
                                        # accepts, since offers are made as percentages
amount_tolerance_paise = 100            # rounding slack when matching a spoken amount

# Spoken when a sentence is blocked before it reaches TTS. Must be safe to say
# at any point in any call, since it can replace anything.
[compliance.recovery_line]
en = "Let me just confirm that and come back to you."
hi = "मैं यह कन्फर्म करके आपको बताती हूँ।"

[compliance.threats]
# These must separate an asserted fact from a hedged possibility: the
# collections script in prompt.md explicitly ALLOWS noting that continued
# non-payment may move an account toward legal recovery. So the patterns match
# certainty, and a match is skipped when a hedge marker sits within
# hedge_window_chars of it (see compliance._hedged).
hedge_window_chars = 60
hedge_markers_en = ['may', 'might', 'could', 'possible', 'possibly']
hedge_markers_hi = ['सकता', 'सकती', 'सकते', 'शायद', 'संभव']
en = [
  '(?i)\b(arrest|arrested|police|jail|f\.?i\.?r\.?)\b',
  '(?i)\blegal action (will|shall|is going to) be\b',
  '(?i)\bwe (are|will be) (filing|taking you to court)\b',
  '(?i)\bfinal notice\b',
  '(?i)\b(seize|seized|confiscate|attach) (your )?(property|house|home|car|assets?)\b',
  '(?i)\b(tell|inform|call|contact|visit) (your )?(employer|boss|office|family|neighbou?rs?|relatives?)\b',
]
# Devanagari has no useful \b, so these use explicit non-letter lookarounds.
hi = [
  '(?<![ऀ-ॿ])(गिरफ़्तार|गिरफ्तार|पुलिस|जेल)(?![ऀ-ॿ])',
  '(?<![ऀ-ॿ])(केस दर्ज|मुकदमा|कोर्ट केस)(?![ऀ-ॿ])',
  '(?<![ऀ-ॿ])(कुर्की|ज़ब्त|जब्त)(?![ऀ-ॿ])',
]

[compliance.inbound]
# One list per flag code per language. Precedence BETWEEN codes is fixed in
# code, not here - self_harm must never be reorderable below anything else.
self_harm_en = ['(?i)\b(kill myself|end my life|suicide|suicidal|no reason to live|better off dead)\b']
self_harm_hi = ['(?<![ऀ-ॿ])(आत्महत्या|जान दे दूँगा|जान दे दूंगी|मर जाऊँगा)']
distress_en = ['''(?i)\b(can'?t take (it|this) any ?more|i'?m breaking down|at the end of my rope)\b''']
distress_hi = ['(?<![ऀ-ॿ])(बहुत परेशान|सह नहीं पा)']
opt_out_en = ['''(?i)\b(stop calling|do ?n'?t call( me)? again|remove my number|do not call|never call me)\b''']
opt_out_hi = ['(?<![ऀ-ॿ])(फ़ोन मत क|फोन मत क|दोबारा मत क|कॉल मत क)']
dispute_en = ['''(?i)\b(not my (loan|debt|account)|i (never|did ?n'?t) (took?|take)|this is wrong|already paid)\b''']
dispute_hi = ['(?<![ऀ-ॿ])(मेरा लोन नहीं|मैंने नहीं लिया|पहले ही भर)']
wrong_number_en = ['(?i)\b(wrong number|no ?one (by that name|here called))\b']
wrong_number_hi = ['(?<![ऀ-ॿ])(गलत नंबर|ग़लत नंबर)']
third_party_en = ['''(?i)\b(he|she|they)('?s| is| are) not (here|available|home)\b''', '(?i)\bwho ?i?s (this|calling)\b']
third_party_hi = ['(?<![ऀ-ॿ])(वो घर पर नहीं|यहाँ नहीं ह)']
human_request_en = ['(?i)\b(real person|a human|speak to (a |an )?(agent|manager|supervisor|person))\b']
human_request_hi = ['(?<![ऀ-ॿ])(किसी इंसान से|आदमी से बात)']
injection_en = ['(?i)\b(ignore (all |your )?(previous |prior )?instructions|you are now|system prompt|disregard (your|all) (rules|instructions))\b']

[compliance.numerals.hi]
# Hindi 1-99 are irregular lexical items - there is no algorithm, only this
# table (see app/text/numerals.py). Seeded with the scale words, the common
# small numbers, and the figures the collections script actually uses. Expected
# to GROW from real blocked_output evidence rather than be completed up front:
# romanised Hindi has several spellings per number and no authority to
# enumerate them, so entries are added when a real call proves one missing.
