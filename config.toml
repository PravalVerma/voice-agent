[collections]
# The scripted stages of a collections call. GREETING and VERIFY are never
# model-generated and never paraphrased - the opening disclosure is a
# regulatory requirement, not a style choice, so it is fixed text that an
# admin can reword but the model can never rewrite.
#
# {customer} and {lender} are filled from the customer record. Lines carrying
# them are synthesised per call; the rest are cached to disk once per
# (language, voice) - splicing cached fragments around a name produces audibly
# wrong intonation at the seams, so those lines are simply not cached.
verify_strikes = 3           # after this many failures, offer a callback rather than
                             # hanging up: Indic STT mangles spoken dates often enough
                             # that a cold drop would fail real customers routinely
max_tokens = 700             # NEGOTIATE turns carry tool schemas plus gpt-oss reasoning
                             # tokens; the global [llm] 400 truncates a reply that also
                             # emits a tool call

[collections.scripts.en]
greeting = "Hello, am I speaking with {customer}? This is an automated assistant calling on behalf of {lender}, and this call is recorded."
verify_dob = "Before we go further, could you confirm your date of birth?"
verify_phone_last4 = "Before we go further, could you confirm the last four digits of your registered phone number?"
verify_pin = "Before we go further, could you confirm your account PIN?"
verify_retry = "Sorry, that did not match our records. Could you try once more?"
verify_failed = "I was not able to confirm your identity, so I will arrange for a callback instead. Thank you for your time."
third_party = "No problem at all. I will try again another time. Thank you."
optout_ack = "Understood. I have recorded that you do not want further calls, and you will not be contacted again. Thank you."
# Gives a real resource and is honest about what this line is. The system has
# no call centre to transfer to, and promising a handoff it cannot perform
# would be worse than saying nothing.
distress = "I am sorry you are going through this, and thank you for telling me. This is an automated line, so I cannot connect you to a person right now. If you would like to talk to someone, Tele-MANAS is available free on 14416, at any hour. I will close this call here and nobody will call you back about the account today."
close = "Thank you for your time. Goodbye."
# Spoken while a tool runs, and if one fails. Both are cached, so they add no
# latency of their own - which is the entire point of having them.
tool_filler = "One moment, let me check that."
tool_failed = "I am not able to check that right now, but I have made a note of it."
# Spoken when the model answers a completed tool with another tool call rather
# than words. Deliberately carries no figures, so it is safe to say after any
# tool without needing to clear the outbound screen.
tool_done = "That is recorded, thank you."

[collections.scripts.hi]
greeting = "नमस्ते, क्या मैं {customer} से बात कर रही हूँ? मैं {lender} की ओर से एक automated assistant बोल रही हूँ, और यह call record की जा रही है।"
verify_dob = "आगे बढ़ने से पहले, क्या आप अपनी date of birth confirm कर सकते हैं?"
verify_phone_last4 = "आगे बढ़ने से पहले, क्या आप अपने registered phone number के आख़िरी चार digits confirm कर सकते हैं?"
verify_pin = "आगे बढ़ने से पहले, क्या आप अपना account PIN confirm कर सकते हैं?"
verify_retry = "माफ़ कीजिए, यह हमारे record से match नहीं हुआ। क्या आप एक बार और कोशिश कर सकते हैं?"
verify_failed = "मैं आपकी identity confirm नहीं कर पाई, इसलिए मैं callback arrange कर देती हूँ। आपके समय के लिए धन्यवाद।"
third_party = "कोई बात नहीं। मैं किसी और समय try करूँगी। धन्यवाद।"
optout_ack = "समझ गई। मैंने record कर लिया है कि आप आगे calls नहीं चाहते, अब आपको दोबारा contact नहीं किया जाएगा। धन्यवाद।"
distress = "मुझे खेद है कि आप इस दौर से गुज़र रहे हैं, और बताने के लिए धन्यवाद। यह एक automated line है, इसलिए मैं आपको अभी किसी व्यक्ति से नहीं जोड़ सकती। अगर आप किसी से बात करना चाहें, तो Tele-MANAS किसी भी समय 14416 पर निःशुल्क उपलब्ध है। मैं यह call यहीं बंद कर रही हूँ और आज account के बारे में कोई आपको call नहीं करेगा।"
close = "आपके समय के लिए धन्यवाद। नमस्ते।"
tool_filler = "एक मिनट, मैं अभी check करती हूँ।"
tool_failed = "मैं अभी यह check नहीं कर पा रही हूँ, लेकिन मैंने note कर लिया है।"
tool_done = "यह record हो गया है, धन्यवाद।"
